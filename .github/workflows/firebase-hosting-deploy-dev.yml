name: Deploy to Firebase Hosting (dev)

on:
  push:
    branches:
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Regenera os artefatos do build_runner (`*.g.dart`/`*.freezed.dart`) e
      # falha o CI se algo ficou dessincronizado dos fontes anotados
      # (`@freezed`/`@riverpod`). Os gerados são versionados (ver
      # `.claude/rules/git-workflow.md`), então `git diff` acusa se o commit
      # esqueceu de regenerar. `--delete-conflicting-outputs` foi removido no
      # build_runner recente (agora é o comportamento padrão).
      - name: Codegen (build_runner)
        run: dart run build_runner build

      - name: Verifica gerados em dia
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Arquivos gerados desatualizados. Rode 'dart run build_runner build' e commite os *.g.dart/*.freezed.dart."
            git status --porcelain
            git diff
            exit 1
          fi

      # Em Dart, a checagem de tipos faz parte da análise estática — `flutter
      # analyze` é lint + typecheck num comando só (não há passo separado tipo
      # `tsc --noEmit`). `--fatal-infos` faz qualquer info/warning derrubar o CI.
      # Checagem de formatação (`dart format --set-exit-if-changed`) ainda não
      # entra: o projeto não segue `dart format` hoje (ver CICD.md, "Próximos passos").
      - name: Analyze (lint + typecheck)
        run: flutter analyze --fatal-infos

  build_and_deploy_dev:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (dev)
        run: flutter build web --release --dart-define=APP_ENV=dev

      - name: Deploy to Firebase Hosting (dev)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_DEV }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules --project debugaomascote-dev --token "$FIREBASE_TOKEN" --non-interactive
